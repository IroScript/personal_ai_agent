name: AI Productivity Agent

# ==============================================================================
# ⏰ GITHUB ACTIONS SCHEDULE & TIMEZONE LOGIC
# ==============================================================================
#
# 🇧🇩 BANGLADESH STANDARD TIME (BST) = UTC + 6 HOURS
#
# ❌ PROHIBITED SLEEP HOUR RANGE (ঘুমের সময় - কোনো রান হবে না):
#    রাত ১:০০ (1:00 AM BST) থেকে সকাল ৭:০০ (7:00 AM BST) পর্যন্ত কোনো অ্যাকশন চলবে না।
#    - 1:00 AM BST = 19:00 UTC (prohibited)
#    - 7:00 AM BST = 01:00 UTC (prohibited)
#
# ✅ ALLOWED RUNNING HOUR RANGE:
#    সকাল ৭:৩০ (7:30 AM BST) থেকে রাত ১২:৩০ (12:30 AM BST) পর্যন্ত প্রতি ৩০ মিনিটে চলবে।
#
# 🕒 UTC CONVERSIONS & CRON RULES:
#    1. '30 1 * * *'     -> 01:30 UTC = 7:30 AM BST (সকালের প্রথম রান)
#    2. '*/30 2-18 * * *' -> 02:00 UTC to 18:30 UTC = 8:00 AM BST to 12:30 AM BST (প্রতি ৩০ মিনিট)
#
# ⚠️ If you want to change this schedule in the future, modify the cron expressions below.
# ==============================================================================

on:
  schedule:
    # 7:30 AM BST (01:30 UTC)
    - cron: '30 1 * * *'
    # Every 30 minutes from 8:00 AM BST (02:00 UTC) to 12:30 AM BST (18:30 UTC)
    - cron: '*/30 2-18 * * *'
  
  workflow_dispatch:  # Manual trigger করতে পারবে

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔍 Debug - List files
      run: |
        echo "Current directory:"
        pwd
        echo "Files in root:"
        ls -la
        echo "Checking requirements.txt:"
        cat requirements.txt | head -10
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Create config.json from secrets
      run: |
        echo '${{ secrets.CONFIG_JSON }}' > config.json
    
    - name: 🤖 Run AI Productivity Agent
      run: |
        python ai_agent.py --mode dynamic 2>&1 | tee agent_output.log
        echo "--- Agent Output End ---"
        cat agent_output.log
      env:
        PYTHONIOENCODING: utf-8
    
    - name: ✅ Job completed
      if: success()
      run: echo "AI Agent ran successfully at $(date)"
    
    - name: ❌ Job failed
      if: failure()
      run: echo "AI Agent failed at $(date)"
