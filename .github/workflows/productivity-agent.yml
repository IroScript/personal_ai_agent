name: AI Productivity Agent

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  
  workflow_dispatch:  # Manual trigger করতে পারবে

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔍 Debug - List files
      run: |
        echo "Current directory:"
        pwd
        echo "Files in root:"
        ls -la
        echo "Checking requirements.txt:"
        cat requirements.txt | head -10
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Create config.json from secrets
      run: |
        echo '${{ secrets.CONFIG_JSON }}' > config.json
    
    - name: 🤖 Run AI Productivity Agent
      run: |
        python ai_agent.py --mode dynamic 2>&1 | tee agent_output.log
        echo "--- Agent Output End ---"
        cat agent_output.log
      env:
        PYTHONIOENCODING: utf-8
    
    - name: ✅ Job completed
      if: success()
      run: echo "AI Agent ran successfully at $(date)"
    
    - name: ❌ Job failed
      if: failure()
      run: echo "AI Agent failed at $(date)"
